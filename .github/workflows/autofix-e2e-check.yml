name: autofix-e2e-check

# E2E sentinel checks. sentinel-fast is the only marker-sensitive check; the
# gate just holds the suite open (always passes) so an early failure happens
# while the suite is still pending. Run A (normal single-check) config.

on:
  pull_request:

permissions:
  contents: read

jobs:
  sentinel-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail fast if sentinel marker present
        run: |
          if grep -rIn "AUTOFIX_SHOULD_REMOVE_THIS" --exclude-dir=.git --exclude="autofix-e2e-check.yml" .; then
            echo "::error::[fast] Found sentinel marker AUTOFIX_SHOULD_REMOVE_THIS. Remove the line(s) to pass."
            exit 1
          fi
          echo "No sentinel marker found — fast check passes."

  sentinel-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Hold the suite open so the fast failure lands before settle
        run: sleep 45
      - name: Always pass
        run: echo "gate passes — keeps the suite unsettled while the fast check fails."
